name: GitHub Release

# Pushing a v* tag builds the zips (self-contained, unpackaged) for x64 and arm64, writes the
# sha256 sidecars the in-app updater verifies against, builds an unsigned MSIX for Store
# submission / signed sideloading, and attaches everything to a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Check that the tag matches the project version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $version = ([xml](Get-Content ScreenshotBooth.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($tag -ne $version) { throw "Tag v$tag does not match <Version>$version</Version> in ScreenshotBooth.csproj (run Release.ps1 -Version $tag first)." }

      - name: Publish x64
        run: dotnet publish ScreenshotBooth.csproj -c Release -p:PublishProfile=win-x64

      - name: Publish arm64
        run: dotnet publish ScreenshotBooth.csproj -c Release -p:PublishProfile=win-arm64

      - name: Build MSIX (unsigned)
        run: msbuild ScreenshotBooth.csproj -restore -p:Configuration=Release -p:Platform=x64 -p:Packaged=true -v:m

      - name: Create archives and checksums
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path bin/publish/win-x64/*   -DestinationPath "dist/ScreenshotBooth-$tag-win-x64.zip"
          Compress-Archive -Path bin/publish/win-arm64/* -DestinationPath "dist/ScreenshotBooth-$tag-win-arm64.zip"
          # sha256sum format; the zip self-update refuses releases without these.
          foreach ($zip in Get-ChildItem dist/*.zip) {
            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -Path "$($zip.FullName).sha256" -Value "$hash  $($zip.Name)" -NoNewline
          }
          $msix = Get-ChildItem bin/msix -Recurse -Filter "ScreenshotBooth_*.msix" | Select-Object -First 1
          if ($msix) { Copy-Item $msix.FullName "dist/ScreenshotBooth-$tag-x64-unsigned.msix" }
          Get-ChildItem dist

      - name: Create or update the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi

      # winget (same recipe as Petapeta / XTimelineViewer). The package has to exist in
      # microsoft/winget-pkgs first: Tools/Submit-Winget.ps1 does that one-time submission. After
      # that, every release is submitted here as long as the WINGET_TOKEN secret (a GitHub token
      # with public_repo on the daruyanagi/winget-pkgs fork) is set; without it these steps skip.
      #
      # The fork drifts behind upstream and komac then fails with a misleading CreateRef permission
      # error (winget-releaser#319), so the fork is synced first; a failed sync must not block.
      - name: Sync winget-pkgs fork
        if: env.WINGET_TOKEN != ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          gh api -X POST repos/daruyanagi/winget-pkgs/merge-upstream \
            -f branch=master --jq '.message'

      - name: Publish to winget
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: daruyanagi.ScreenshotBooth
          installers-regex: '\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
